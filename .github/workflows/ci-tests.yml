name: ci-tests

on:
  pull_request:
  push:

env:
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

jobs:
  unit-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Scala
        uses: olafurpg/setup-scala@v14
        with:
          java-version: "adopt@1.8"
      - name: Build and Unit Tests
        run: sbt -v -Dfile.encoding=UTF-8 +clean +test

  coverage:
    name: Code Coverage
    strategy:
      fail-fast: false
      matrix:
        scala: [2.12.20, 2.13.18, 3.3.3]
        subproject: [core, bigquery, jsonCirce, cassandra, spark, examples]
        exclude:
          # Spark is not released for Scala 3.
          - scala: 3.3.3
            subproject: spark
          # Examples only cross-build for Scala 2.
          - scala: 3.3.3
            subproject: examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Scala
        uses: olafurpg/setup-scala@v14
        with:
          java-version: "adopt@1.8"
      - name: Coverage for Scala
        run: sbt ++${{ matrix.scala }} "project ${{ matrix.subproject }}" clean coverage test
      - name: Coverage Report
        run: sbt ++${{ matrix.scala }} "project ${{ matrix.subproject }}" coverageReport
      - name: Codecov
        # NOTE: uploads stay tokenless until CODECOV_TOKEN is configured
        # in the repo secrets. Do NOT bump to codecov-action v4/v5
        # (token required) before that, and do NOT move the upload to a
        # separate job without passing the coverage files as artifacts.
        uses: codecov/codecov-action@v3
        with:
          verbose: false # optional (default = false)
          flags: unittests
